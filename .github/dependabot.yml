version: 2
updates:
  # Kotlin/JVM dependencies and plugins from gradle/libs.versions.toml
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # The wrapper version lives in libs.versions.toml and is applied with `make upgrade-wrapper`,
      # which also regenerates gradle-wrapper.jar and the gradlew scripts.
      - dependency-name: gradle-wrapper
    groups:
      gradle-minor-and-patch:
        update-types: [minor, patch]

  # Actions used by .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  # Zensical documentation site
  - package-ecosystem: uv
    directory: /website
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      website:
        patterns: ["*"]

  # The Dockerfile's base image, pinned by digest. Dependabot moves the digest as the tag gets rebuilt with Alpine and
  # JRE fixes. A new Java major has to move together with `jre` in gradle/libs.versions.toml, so majors are ignored.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: eclipse-temurin
        update-types: [version-update:semver-major]
